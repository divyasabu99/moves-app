kind = "mobile"
previewPath = "/"
title = "MOVES"
version = "1.0.0"
id = "artifacts/moves"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20883

[services.development]
run = "pnpm --filter @workspace/moves run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/moves", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/moves", "run", "serve" ]

[services.env]
PORT = "20883"
BASE_PATH = "/"
